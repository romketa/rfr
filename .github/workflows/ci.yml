name: CI

on:
  pull_request:

jobs:
  backend:
    name: Build rfr-auth and rfr-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      - run: ./gradlew :rfr-auth:build :rfr-api:build

  e2e:
    name: Compile rfr-e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - uses: gradle/actions/setup-gradle@v5
      # Compile only: running the tests needs the whole stand (MySQL, rfr-auth, rfr-api, frontend)
      - run: ./gradlew :rfr-e2e:testClasses

  frontend:
    name: Lint and build rfr-gql-client
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rfr-gql-client
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: rfr-gql-client/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
